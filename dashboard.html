<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdNova · AI Marketing Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script src="auth.js"></script>
  <style>
    body { font-family: Inter, system-ui, sans-serif; }
    .glass { background: linear-gradient(140deg, rgba(255,255,255,.96), rgba(245,243,255,.92)); }
    .nav-active { background: rgba(139,92,246,.16); color: #4c1d95; border:1px solid rgba(139,92,246,.30); }
    .chip-active { background: #7c3aed; color: #fff; border-color: #7c3aed; }
  </style>
</head>
<body class="bg-gradient-to-br from-violet-50 via-white to-fuchsia-50 text-slate-900">
<div class="h-screen flex overflow-hidden">
  <aside class="w-72 hidden md:flex md:flex-col border-r border-violet-100 bg-white/85 backdrop-blur relative z-30 shrink-0">
    <div class="p-5 border-b border-violet-100">
      <a href="dashboard.html" class="flex items-center gap-3" aria-label="AdNova home">
        <img src="logo.png" alt="AdNova logo" class="w-9 h-9 rounded-lg object-cover">
        <div>
          <h1 class="text-2xl font-bold text-violet-700 leading-tight">AdNova</h1>
          <p class="text-sm text-slate-500">AI Marketing Workspace</p>
        </div>
      </a>
    </div>
    <nav id="nav" class="p-3 space-y-2 text-sm pointer-events-auto"></nav>
  </aside>

  <main class="flex-1 p-4 md:p-6 overflow-y-auto relative z-10">
    <div class="grid grid-cols-1 xl:grid-cols-12 gap-5 min-h-full">
      <section class="xl:col-span-7 glass rounded-3xl shadow-lg border border-violet-100 p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-2xl font-semibold">Create with AI</h2>
          <span class="text-xs px-3 py-1 rounded-full bg-violet-100 text-violet-700">Fast Prompt Mode</span>
        </div>

        <div class="mb-4">
          <p class="text-sm font-medium mb-2">Choose a task</p>
          <div id="chips" class="flex flex-wrap gap-2"></div>
        </div>

        <div class="rounded-2xl border border-violet-200 bg-white p-4">
          <label for="prompt" class="sr-only">Prompt</label>
          <textarea id="prompt" class="w-full h-44 resize-none outline-none text-base" placeholder="Describe what you want to create..."></textarea>
          <div class="mt-3 flex items-center justify-between gap-2">
            <button id="toggle-advanced" class="text-sm px-3 py-1.5 rounded-xl border border-violet-200 hover:bg-violet-50">More details (optional)</button>
            <button id="generate" class="rounded-2xl px-6 py-2.5 font-semibold bg-violet-600 hover:bg-violet-700 text-white">Generate</button>
          </div>
        </div>

        <div id="advanced" class="hidden mt-4 rounded-2xl border border-violet-200 bg-white p-4">
          <p class="text-sm font-semibold text-violet-700 mb-3">Optional business info</p>
          <div class="grid md:grid-cols-2 gap-3" id="optional-fields"></div>
        </div>
      </section>

      <aside class="xl:col-span-5 glass rounded-3xl shadow-lg border border-violet-100 p-6">
        <div class="flex items-center justify-between">
          <h3 class="text-xl font-semibold">3 Variations</h3>
          <button id="copy-all" class="text-sm px-3 py-1 rounded-xl bg-white border border-violet-200">Copy Everything</button>
        </div>
        <div class="mt-4 space-y-4" id="results"></div>
      </aside>
    </div>
  </main>
</div>

<script>
const taskTypes = ['Ad Copy','Reel Script','Poster','Food Promo','Product Showcase','Social Caption','Hook Generator'];
const optionalKeys = ['Industry','Product / Service Name','Offer / Promotion','Target Audience','Platform','Tone','Language'];
const navItems = [
  {label:'Overview', href:'dashboard.html'},
  {label:'AI Marketing Workspace', href:'dashboard.html', active:true},
  {label:'Saved Results', action:'saved'},
  {label:'Publishing', action:'publish'},
  {label:'Billing', action:'billing'},
  {label:'My Account', action:'account'}
];

const nav = document.getElementById('nav');
nav.innerHTML = navItems.map(item => `<button data-href="${item.href||''}" data-action="${item.action||''}" class="nav-item w-full text-left px-3 py-2 rounded-xl border ${item.active?'nav-active border-violet-300':'border-transparent hover:bg-violet-50'}">${item.label}</button>`).join('');

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    const href = btn.dataset.href;
    if (href) { window.location.href = href; return; }
    const action = btn.dataset.action;
    if (action === 'saved') window.location.href = 'dashboard.html#saved-results';
    if (action === 'publish') window.location.href = 'workspace.html';
    if (action === 'billing') alert('Billing module coming soon.');
    if (action === 'account') window.location.href = 'register.html';
  });
});

const chips = document.getElementById('chips');
let selectedTask = 'Ad Copy';
function renderChips() {
  chips.innerHTML = taskTypes.map(type => `<button class="task-chip px-3 py-1.5 rounded-full border border-violet-200 text-sm hover:bg-violet-50 ${selectedTask===type?'chip-active':''}" data-type="${type}">${type}</button>`).join('');
  document.querySelectorAll('.task-chip').forEach(btn => btn.addEventListener('click', () => { selectedTask = btn.dataset.type; renderChips(); }));
}
renderChips();

const optional = document.getElementById('optional-fields');
optional.innerHTML = optionalKeys.map(k => `<input data-k="${k}" placeholder="${k}" class="rounded-2xl border border-violet-200 p-3">`).join('');

document.getElementById('toggle-advanced').addEventListener('click', () => {
  document.getElementById('advanced').classList.toggle('hidden');
});

function genVariation(i, task, prompt) {
  return {
    title: `Variation ${i} · ${task}`,
    copy: `${prompt || 'Create a premium campaign concept'} tailored as ${task.toLowerCase()} output with a clear performance angle.`,
    cta: i === 1 ? 'Shop Now' : i === 2 ? 'Learn More' : 'Get Offer',
    body: task === 'Poster' ? 'Poster text: Hero headline + supporting line + offer badge + CTA strip.' : (task === 'Reel Script' ? 'Script: Hook (0-3s), problem, solution, social proof, CTA ending.' : 'Caption/script block: Hook + value + offer + CTA with strong scroll-stop opener.'),
    visual: 'Visual suggestion: Purple gradient backdrop, premium product focus, clean contrast typography.',
    shot: 'Shot/layout suggestion: 3-shot sequence (close-up, context, offer frame) with logo-safe corner placement.',
    prediction: ['Estimated Engagement: High','Conversion Potential: Medium-High','Audience Match: Strong']
  };
}

function renderResults(arr) {
  const root = document.getElementById('results');
  if (!arr.length) {
    root.innerHTML = '<p class="text-sm text-slate-500">Type your idea, optionally pick a template, and click Generate.</p>';
    return;
  }
  root.innerHTML = arr.map((x, idx) => `
    <article class="bg-white rounded-2xl border border-violet-100 p-4 shadow-sm">
      <h4 class="font-semibold">${x.title}</h4>
      <div class="text-sm mt-2 space-y-1">
        <p><strong>Main copy:</strong> ${x.copy}</p>
        <p><strong>CTA:</strong> ${x.cta}</p>
        <p><strong>Script / Caption / Poster text:</strong> ${x.body}</p>
        <p><strong>Image or visual suggestion:</strong> ${x.visual}</p>
        <p><strong>Shot or layout suggestion:</strong> ${x.shot}</p>
      </div>
      <div class="mt-3 p-3 rounded-xl bg-violet-50">
        <p class="text-xs font-semibold text-violet-700">AI Prediction</p>
        ${x.prediction.map(p => `<span class='inline-block mr-2 mt-2 text-xs px-2 py-1 rounded-full bg-white border border-violet-200'>${p}</span>`).join('')}
      </div>
      <div class="mt-3 grid grid-cols-2 gap-2 text-sm">
        <button onclick="copyCard(${idx})" class="rounded-xl border p-2">Copy</button>
        <button onclick="downloadCard(${idx})" class="rounded-xl border p-2">Download</button>
        <button onclick="saveCard(${idx})" class="rounded-xl border p-2">Save</button>
        <button onclick="regenOne(${idx})" class="rounded-xl border p-2">Regenerate</button>
      </div>
    </article>
  `).join('');
  window._results = arr;
}

function gatherPrompt() {
  const base = document.getElementById('prompt').value.trim();
  const extras = [...document.querySelectorAll('#optional-fields input')].filter(i => i.value.trim()).map(i => `${i.dataset.k}: ${i.value.trim()}`).join(' | ');
  return `${base}${extras ? ` | ${extras}` : ''}`;
}

function dl(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: 'text/plain'}));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

window.copyCard = i => navigator.clipboard.writeText(`${window._results[i].title}\n${window._results[i].copy}\n${window._results[i].body}`);
window.downloadCard = i => dl(`adnova-variation-${i+1}.txt`, `${window._results[i].title}\n${window._results[i].copy}\n${window._results[i].body}`);
window.saveCard = i => {
  const saved = JSON.parse(localStorage.getItem('adnova_saved') || '[]');
  saved.unshift({...window._results[i], savedAt: new Date().toISOString()});
  localStorage.setItem('adnova_saved', JSON.stringify(saved));
};
window.regenOne = i => {
  const prompt = gatherPrompt() || 'new concept';
  window._results[i] = genVariation(i+1, selectedTask, `${prompt} regenerated`);
  renderResults(window._results);
};

document.getElementById('generate').addEventListener('click', () => {
  const prompt = gatherPrompt();
  renderResults([1,2,3].map(i => genVariation(i, selectedTask, prompt)));
});

document.getElementById('copy-all').addEventListener('click', () => {
  const text = (window._results || []).map(r => `${r.title}\n${r.copy}\n${r.body}`).join('\n\n');
  navigator.clipboard.writeText(text);
});

renderResults([]);
</script>
</body>
</html>
