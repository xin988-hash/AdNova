<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdNova · AI Marketing Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script src="auth.js"></script>
  <style>
    body { font-family: Inter, system-ui, sans-serif; }
    .glass { background: linear-gradient(140deg, rgba(255,255,255,.96), rgba(245,243,255,.92)); }
    .nav-active { background: rgba(139,92,246,.15); color: #4c1d95; border:1px solid rgba(139,92,246,.25); }
  </style>
</head>
<body class="bg-gradient-to-br from-violet-50 via-white to-fuchsia-50 text-slate-900">
<div class="h-screen flex overflow-hidden">
  <aside class="w-72 hidden md:flex flex-col border-r border-violet-100 bg-white/80 backdrop-blur">
    <div class="p-5 border-b border-violet-100"><h1 class="text-2xl font-bold text-violet-700">AdNova</h1><p class="text-sm text-slate-500">AI Marketing Workspace</p></div>
    <nav id="nav" class="p-3 space-y-2 text-sm"></nav>
  </aside>
  <main class="flex-1 p-4 md:p-6 overflow-y-auto">
    <div class="grid grid-cols-1 xl:grid-cols-12 gap-5 min-h-full">
      <section class="xl:col-span-7 glass rounded-3xl shadow-lg border border-violet-100 p-6">
        <div class="flex items-center justify-between mb-4"><h2 class="text-2xl font-semibold" id="task-title">New Project</h2><span class="text-xs px-3 py-1 rounded-full bg-violet-100 text-violet-700">Prompt Router</span></div>
        <div class="space-y-4">
          <div><label class="text-sm font-medium">Task Selector</label><select id="task" class="w-full mt-1 rounded-2xl border border-violet-200 p-3"></select></div>
          <div class="grid md:grid-cols-2 gap-3" id="common-fields"></div>
          <div class="grid md:grid-cols-2 gap-3" id="task-fields"></div>
          <div><label class="text-sm font-medium">Freeform Instructions</label><textarea id="freeform" class="w-full mt-1 rounded-2xl border border-violet-200 p-3 h-28" placeholder="e.g. make a premium poster for a milk tea promo"></textarea></div>
          <button id="generate" class="w-full rounded-2xl py-3 font-semibold bg-violet-600 hover:bg-violet-700 text-white">Generate 3 Variations</button>
        </div>
      </section>
      <aside class="xl:col-span-5 glass rounded-3xl shadow-lg border border-violet-100 p-6">
        <div class="flex items-center justify-between"><h3 class="text-xl font-semibold">Result Preview</h3><button id="copy-all" class="text-sm px-3 py-1 rounded-xl bg-white border border-violet-200">Copy Everything</button></div>
        <div class="mt-4 space-y-4" id="results"></div>
      </aside>
    </div>
  </main>
</div>
<script>
const tasks = {
  ad_copy:{label:'AI Ad Copy',fields:['campaignGoal'],out:['Hook','Primary Text','CTA','Audience Angle','Suggested Creative Direction','Budget Suggestion','Campaign Direction']},
  reel:{label:'Reel Script Generator',fields:['duration'],out:['Hook','Script','Scene List','Shot Suggestions','Caption','Platform Fit','Recommended Duration']},
  poster:{label:'Poster Generator',fields:['format'],out:['Poster Headline','Poster Copy','Layout Direction','Color Direction','Visual Style','CTA','Export Suggestions']},
  product:{label:'Product Showcase',fields:['featureFocus'],out:['Product Description','Visual Angle','Photography Prompt','Banner Copy','Callout Text']},
  food:{label:'Food / Drink Promo',fields:['limitedOffer'],out:['Menu Promo Copy','Visual Prompt','Shot Ideas','Motion Direction','Limited Promo Hook']},
  caption:{label:'Social Media Caption',fields:['platform'],out:['Caption','Opening Hook','Hashtags','Engagement CTA','Platform Fit']},
  hooks:{label:'Hook Generator',fields:['hookStyle'],out:['10 Hooks by style: short, punchy, premium, emotional, sales-focused']}
};
const navItems=['New Chat / New Project','My Projects','AI Ad Copy','Reel Script Generator','Poster Generator','Product Showcase','Food / Drink Promo','Social Media Caption','Hook Generator','Saved Results','Billing','Settings'];
const common=['industry','productService','brand','offer','audience','platform','tone','language','region','formatPreference','specialInstructions'];
const state={saved:JSON.parse(localStorage.getItem('adnova_saved')||'[]')};
const nav=document.getElementById('nav');
nav.innerHTML=navItems.map((n,i)=>`<button class="w-full text-left px-3 py-2 rounded-xl ${i===0?'nav-active hover:bg-violet-50':'hover:bg-violet-50'}"><i class="fa fa-${i===0?'plus-circle':'circle-o'} mr-2 text-violet-500"></i>${n}</button>`).join('');
const taskSel=document.getElementById('task'); taskSel.innerHTML=Object.entries(tasks).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');
const cWrap=document.getElementById('common-fields');
cWrap.innerHTML=common.map(k=>`<input data-k="${k}" placeholder="${k}" class="rounded-2xl border border-violet-200 p-3">`).join('');
function renderTaskFields(){const t=tasks[taskSel.value]; document.getElementById('task-title').textContent=t.label; document.getElementById('task-fields').innerHTML=t.fields.map(f=>`<input data-k="${f}" placeholder="${f}" class="rounded-2xl border border-violet-200 p-3">`).join('');}
function genVariation(i,t,prompt){
  const lines=t.out.map(k=>`<p><strong>${k}:</strong> ${k} for ${prompt.slice(0,70)||'your brief'} · Variation ${i}</p>`).join('');
  const prediction=t.out.length>5?['Estimated Engagement: High','Conversion Potential: Medium-High','Suggested Budget Fit: RM80-150/day','Audience Match: Strong']:['Engagement Potential: High','Scroll-stop Potential: Strong','Platform Fit: Good','Format Fit: Strong'];
  return {title:`Variation ${i} · ${t.label}`,lines,prediction};
}
function renderResults(arr){const r=document.getElementById('results'); if(!arr.length){r.innerHTML='<p class="text-sm text-slate-500">Generate content to preview three premium variations.</p>';return;} r.innerHTML=arr.map((x,idx)=>`<article class="bg-white rounded-2xl border border-violet-100 p-4 shadow-sm"><h4 class="font-semibold">${x.title}</h4><div class="text-sm mt-2 space-y-1">${x.lines}</div><div class="mt-3 p-3 rounded-xl bg-violet-50"><p class="text-xs font-semibold text-violet-700">AI Prediction</p>${x.prediction.map(p=>`<span class='inline-block mr-2 mt-2 text-xs px-2 py-1 rounded-full bg-white border border-violet-200'>${p}</span>`).join('')}</div><div class="mt-3 grid grid-cols-2 gap-2 text-sm"><button onclick="copyCard(${idx})" class="rounded-xl border p-2">Copy</button><button onclick="downloadCard(${idx})" class="rounded-xl border p-2">Download</button><button onclick="saveCard(${idx})" class="rounded-xl border p-2">Save</button><button onclick="regenOne(${idx})" class="rounded-xl border p-2">Regenerate</button></div></article>`).join('')+`<div class='grid grid-cols-2 gap-2'><a target='_blank' href='https://adsmanager.facebook.com/' class='rounded-xl border p-2 text-sm text-center bg-white'>Open Meta Ads Manager</a><a target='_blank' href='https://www.instagram.com/' class='rounded-xl border p-2 text-sm text-center bg-white'>Open Instagram</a><a target='_blank' href='https://www.facebook.com/' class='rounded-xl border p-2 text-sm text-center bg-white'>Open Facebook</a></div>`; window._results=arr; }
function gatherPrompt(){const vals=[...document.querySelectorAll('input[data-k], textarea#freeform')].map(i=>`${i.dataset.k||'freeform'}: ${i.value}`).join(' | '); return vals;}
function dl(name,text){const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown'})); a.download=name; a.click(); URL.revokeObjectURL(a.href);} 
window.copyCard=i=>navigator.clipboard.writeText(window._results[i].title+'\n'+window._results[i].lines.replace(/<[^>]+>/g,''));
window.downloadCard=i=>dl(`adnova-variation-${i+1}.md`,window._results[i].title+'\n'+window._results[i].lines.replace(/<[^>]+>/g,''));
window.saveCard=i=>{state.saved.unshift({...window._results[i],savedAt:new Date().toISOString()}); localStorage.setItem('adnova_saved',JSON.stringify(state.saved));};
window.regenOne=i=>{window._results[i]=genVariation(i+1,tasks[taskSel.value],gatherPrompt()+' regenerated'); renderResults(window._results);};
document.getElementById('generate').onclick=()=>{const t=tasks[taskSel.value]; const p=gatherPrompt(); renderResults([1,2,3].map(i=>genVariation(i,t,p)));};
document.getElementById('copy-all').onclick=()=>navigator.clipboard.writeText((window._results||[]).map(r=>r.title+'\n'+r.lines.replace(/<[^>]+>/g,'')).join('\n\n'));
taskSel.onchange=renderTaskFields; renderTaskFields(); renderResults([]);
</script>
</body>
</html>
